    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.1.0,<3.0.0)"
]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "types-requests (>=2.33.0.20260518,<3.0.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[project]
name = "analize-bank-operations"
version = "0.1.0"
description = ""
authors = [
    {name = "Ruslan Nakhmedov",email = "ruslan-nahmedov@mail.ru"}
]
requires-python = "^3.14"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "path (>=17.1.1,<18.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "twelvedata (>=1.4.0,<2.0.0)",
